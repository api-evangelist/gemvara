name: Gemvara
description: 'Gemvara was a Boston-based direct-to-consumer custom fine-jewelry e-commerce retailer,
  founded in 2006 by Matt Lauzon and Jason Reuben (Babson College), known for made-to-order jewelry
  customization software that let shoppers configure gemstones and metals on demand. Backed by Norwest
  Venture Partners among others, it was acquired by Richline Group (a Berkshire Hathaway company) in 2013
  and shut down in February 2023. The company published no public developer API, and the gemvara.com
  domain no longer resolves to a live site. This profile is retained as a defunct-company record.'
